name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux · swift 6.0 · warnings as errors
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - name: Build (core + adapters; the SwiftUI module compiles to nothing on Linux)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  apple:
    name: macOS 15 · swift test + iOS Simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build all modules for macOS (includes ChangeFeedUI)
        run: swift build
      - name: Test
        run: swift test
      - name: Build all modules for iOS Simulator (compile-only, no device needed)
        run: xcodebuild build -scheme ChangeFeedSpine-Package -destination 'generic/platform=iOS Simulator' -quiet
